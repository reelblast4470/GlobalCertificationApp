evisits an item just before you would forget it.","The error book stores every wrong answer with the inferred reason for the mistake.","Mastery is computed: exposure × (0.6 × accuracy + 0.4 × schedule stability)."],formulas:["Mastery = exposure × (0.6 × accuracy + 0.4 × stability), capped at 100","Exam score = correct − (wrong × negative marking)"],commonConfusion:"Re-reading notes feels productive but is passive. Recall (closing the book and answering) is what builds retention.",oneLineSummary:"Study in a loop: learn a little, immediately recall it, test it, fix mistakes, and let the scheduler bring it back before you forget.",concepts:[{id:"demo-concept-loop",title:"The Study Loop",keywords:["active recall","spaced repetition","mastery","error book","interleaving"],rememberThis:"Learn → Recall → Test → Correct → Repeat → Revise → Master. Small chunks, immediately tested, scheduled back in.",mnemonic:{for:"The seven stages of the study loop",text:"Lively Rabbits Test Carrots, Rarely Regret Munching → Learn, Recall, Test, Correct, Repeat, Revise, Master",note:"The first letter of each word maps to the stage, in order."},blocks:[{kind:"simple",title:"In simple words",body:"This app does not let you read passively. It teaches a small chunk, immediately asks you to recall it, marks what you got wrong, then brings that exact item back tomorrow, then in 3 days, then in 7 — until it sticks."},{kind:"definition",title:"The loop",body:"The study loop is a fixed cycle: **Learn → Recall → Test → Correct → Repeat → Revise → Master**."},{kind:"steps",title:"How a session flows",items:["Learn one concept (2–5 minutes, never a wall of text).","Quick Check: 2–5 questions on that concept, immediately.","Practice: mixed questions, difficulty ramps up as you streak.","Review: every wrong answer lands in your error book with a reason.","Revise: the scheduler brings the item back before you forget it.","Master: topic mastery crosses 96% and the item is retired."]},{kind:"example",title:"Example",body:'You read that a bill becomes an Act after the President gives assent. Instead of re-reading that line five times, you close it and answer: "What turns a bill into an Act?" Getting it wrong is useful — it puts the fact into your error book and schedules it for tomorrow.'},{kind:"facts",title:"Important facts",items:["Active recall beats re-reading for long-term retention.","Spaced repetition revisits an item just before you would forget it.","The revision ladder is 1 → 3 → 7 → 14 → 30 days, and it stretches when you keep getting it right.","Difficulty rises after two correct answers in a row and drops after a miss."]},{kind:"compare",title:"Confusing pair: re-reading vs recall",pairs:[{left:"Re-reading: eyes on notes",right:"Recognises the text; feels easy; fades fast"},{left:"Recall: eyes off notes",right:"Rebuilds the memory; feels hard; lasts"}]},{kind:"examPoint",title:"Exam point",body:"If you only have 15 minutes before an exam, open **⚡ Quick Revision** or your **❌ Error book** — never a fresh chapter."},{kind:"keyword",title:"Remember these terms",items:["Active recall","Spaced repetition","Interleaving","Mastery score","Error book","Negative marking"]},{kind:"trick",title:"Memory trick",body:"**Lively Rabbits Test Carrots, Rarely Regret Munching** → Learn, Recall, Test, Correct, Repeat, Revise, Master."}]}],flashcards:[{id:"demo-card-1",front:"What are the seven stages of the study loop?",back:"Learn → Recall → Test → Correct → Repeat → Revise → Master.",trick:"Lively Rabbits Test Carrots, Rarely Regret Munching"},{id:"demo-card-2",front:"Re-reading vs active recall — which builds retention?",back:"Active recall. Re-reading only builds familiarity with the text; recall rebuilds the memory itself.",trick:"Recall = rebuild. Re-read = recognise."},{id:"demo-card-3",front:"What is the default revision ladder?",back:"1 → 3 → 7 → 14 → 30 days, stretching further each time you get it right.",trick:"Odd doubles: 1-3-7-14-30"},{id:"demo-card-4",front:"How is mastery calculated?",back:"Mastery = exposure × (0.6 × accuracy + 0.4 × schedule stability).",trick:"You cannot master what you have not met (exposure)."}],questions:[{id:"demo-q1",type:"direct",difficulty:"easy",prompt:"What are the stages of the study loop used by this app, in the correct order?",options:[{id:"a",text:"Learn → Recall → Test → Correct → Repeat → Revise → Master"},{id:"b",text:"Read → Memorise → Test → Repeat → Master"},{id:"c",text:"Learn → Test → Revise → Master → Recall"},{id:"d",text:"Recall → Learn → Correct → Test → Revise → Master → Repeat"}],correct:["a"],explanation:"The full cycle is Learn → Recall → Test → Correct → Repeat → Revise → Master.",whyWrong:{b:"Drops four stages and puts memorising before testing.",c:"Drops Correct and Repeat, and puts Recall last.",d:"Starts with Recall — you cannot recall something you have not learned yet."},source:"Demo pack → The Study Loop → The loop",tags:["loop"],hintMnemonic:"Lively Rabbits Test Carrots, Rarely Regret Munching"},{id:"demo-q2",type:"conceptual",difficulty:"medium",prompt:"Why is active recall more effective than re-reading the same notes?",options:[{id:"a",text:"Because recalling rebuilds the memory, while re-reading only builds familiarity with the text"},{id:"b",text:"Because re-reading is physically slower than answering questions"},{id:"c",text:"Because re-reading damages long-term memory"},{id:"d",text:"Because recall can only be done under exam conditions"}],correct:["a"],explanation:"Re-reading creates the feeling of knowing because the text looks familiar. Recall forces you to reconstruct the memory, which is what actually strengthens it.",whyWrong:{b:"Speed is not the mechanism; re-reading is often faster.",c:"An overstatement — re-reading is simply weak, not harmful.",d:"Recall works anywhere: flashcards in a queue count."},source:"Demo pack → The Study Loop → Confusing pair: re-reading vs recall",tags:["recall"]},{id:"demo-q3",type:"application",difficulty:"hard",pro
